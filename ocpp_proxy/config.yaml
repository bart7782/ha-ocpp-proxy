name: OCPP Proxy
version: "1.0.0"
slug: ocpp_proxy
description: Sits between an OCPP 1.6J charger and its backend (e.g. Vattenfall) and turns the traffic into Home Assistant sensors
url: https://github.com/bart7782/ha-ocpp-proxy
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
watchdog: tcp://[HOST]:[PORT:9000]
homeassistant_api: true
ports:
  9000/tcp: 9000
ports_description:
  9000/tcp: The charger connects here (ws://<HA-ip>:9000/<backend path>/)
options:
  upstream: ws://ocpp.e-flux.nl
  tags: []
  log: true
  ha_url: ""
  ha_token: ""
schema:
  upstream: str
  tags:
    - str
  log: bool
  ha_url: str?
  ha_token: password?
